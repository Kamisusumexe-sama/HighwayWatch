<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highway Watch</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--ink:#2b2118;--paper:#fff4d6;--tape:#e8b92c;--red:#c4452d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#2b2118;--paper:#fff4d6}}
html,body{height:100%;margin:0;background:#3f6a35;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;color:var(--ink)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:5px 9px;font-weight:800;font-size:15px;box-shadow:3px 3px 0 var(--ink)}
#fx span{position:fixed;font-family:'Bowlby One',Impact,sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;font-size:26px;pointer-events:none;transform:translate(-50%,-50%);animation:pop .8s ease-out forwards}
@keyframes pop{to{transform:translate(-50%,-150%) scale(1.2);opacity:0}}
#combo{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);right:10px;text-align:right;pointer-events:none;display:none;width:150px;opacity:.92}
#ctext{font-family:'Bowlby One',Impact,sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink);line-height:1.05}
.bump{transform-origin:right center;animation:bump .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{from{transform:scale(.6) rotate(-6deg)}to{transform:scale(1) rotate(0)}}
#cwrap{height:6px;background:rgba(0,0,0,.35);border:2px solid var(--ink);border-radius:6px;margin-top:6px;overflow:hidden}
#cspd{font-weight:800;color:#fff;text-shadow:2px 2px 0 var(--ink);margin-top:3px;font-size:13px}
#cbar{height:100%;width:100%;background:var(--tape)}
#banner{position:fixed;top:30%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;width:min(90vw,520px)}
#banner.show{animation:bn 3s ease forwards}
.bm{font-family:'Bowlby One',Impact,sans-serif;font-size:clamp(30px,7vw,54px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);line-height:1}
.bs{margin-top:8px;font-weight:800;font-size:18px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
@keyframes bn{0%{opacity:0;transform:translateX(-50%) scale(.5)}10%{opacity:1;transform:translateX(-50%) scale(1.08)}16%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
#pausebtn{pointer-events:auto;cursor:pointer;margin:0;color:var(--ink)}
@media (max-width:480px){.chip{font-size:13px;padding:4px 7px}#hud{gap:4px}}
#hs{margin:12px 0 0;text-align:left}
.hsrow{display:flex;justify-content:space-between;gap:24px;font-weight:800;border-bottom:2px dashed rgba(43,33,24,.3);padding:4px 0}
.newhs{font-family:'Bowlby One',Impact,sans-serif;color:var(--red);font-size:20px;margin:10px 0 0;animation:bump .5s}
#btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#msg{font-size:15px}
#menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto;background:radial-gradient(ellipse at 70% 45%,rgba(255,214,120,.6),rgba(28,40,24,.88) 72%)}
#mstage{display:flex;gap:26px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:900px}
#mleft{text-align:center;min-width:260px;max-width:340px}
#logo{font-family:'Bowlby One',Impact,sans-serif;line-height:.95;text-transform:uppercase;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
#logo span{display:block;font-size:clamp(40px,9vw,70px)}
#logo .l1{color:#fcd116;transform:rotate(-3deg)}#logo .l2{color:#ce1126;transform:rotate(2deg)}
#logo:after{content:'';display:block;height:12px;margin:12px auto 0;width:80%;border:3px solid var(--ink);border-radius:6px;background:linear-gradient(90deg,#ce1126 0 33%,#fcd116 33% 66%,#006b3f 66%)}
#tag{color:#fff;font-weight:800;text-shadow:2px 2px 0 var(--ink);margin:12px 0 4px}
#mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#mhs{margin:16px auto 0;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:8px 14px;box-shadow:4px 4px 0 var(--ink);text-align:left}
#mright{position:relative;width:260px;display:flex;flex-direction:column;align-items:center}
#spot{position:absolute;left:0;right:0;bottom:30px;height:60%;background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.4),transparent 70%)}
#dancer{position:relative;width:260px;height:360px}
#dname{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:4px 12px;font-weight:800;font-size:14px;box-shadow:3px 3px 0 var(--ink);margin-top:-6px}
.krow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:2px dashed rgba(43,33,24,.3)}
.krow>span{font-weight:800;font-size:15px}.krow>div{display:flex;gap:6px}
.keybtn{margin:0;padding:4px 8px;font-size:14px;min-width:58px;box-shadow:2px 2px 0 var(--ink)}
.cap{background:#7fd4ff}
#menu{background:radial-gradient(ellipse at 50% 40%,rgba(60,15,10,.78),rgba(10,3,3,.94));padding:8px}
#poster{position:relative;height:min(94vh,122.6vw);aspect-ratio:3/4;isolation:isolate;overflow:hidden;background:#400;border:4px solid #1a1210;box-shadow:0 0 0 6px #f3e6c4,10px 14px 0 rgba(0,0,0,.5);transform:rotate(-.6deg)}
@media (max-aspect-ratio:3/4){#poster{width:96vw;height:94vh;aspect-ratio:auto}}
#poster canvas{position:absolute;inset:0;width:100%;height:100%}
#pfx{mix-blend-mode:multiply;pointer-events:none}
#pchars{filter:saturate(1.25) contrast(1.08);pointer-events:none}
#ptitle{position:absolute;top:1%;left:0;width:100%;height:auto;pointer-events:none;animation:tpulse 9s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
@keyframes tpulse{0%,78%,100%{transform:scale(1)}88%{transform:scale(1.025)}}
#pflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:pflash 11s infinite}
@keyframes pflash{0%,91%{opacity:0}93%{opacity:.32}97%,100%{opacity:0}}
#pscore{position:absolute;top:30%;right:2.5%;width:22%;aspect-ratio:1;z-index:1;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(11deg);font-family:Anton,Impact,sans-serif;color:#b3121a;text-align:center;line-height:1;filter:drop-shadow(3px 4px 0 #1a0505)}
#pscore::before{content:'';position:absolute;inset:0;background:#ffd23f;clip-path:var(--star);z-index:-1}
#pscore small{font-size:clamp(10px,1.8vh,15px);letter-spacing:.12em}#pscore b{font-size:clamp(20px,4.2vh,36px)}
#pbottom{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:7% 4% 3%;display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(transparent,rgba(10,0,0,.85) 55%)}
.cred{font-family:Anton,Impact,sans-serif;color:#f3e6c4;font-size:clamp(9px,1.5vh,13px);letter-spacing:.14em;text-align:center;line-height:1.5;text-shadow:1px 1px 0 #000}
#mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
#pbottom button{font-family:Anton,Impact,sans-serif;font-size:clamp(15px,3vh,24px);letter-spacing:.06em;text-transform:uppercase;color:#ffe36a;background:linear-gradient(#e0282a,#9b0f14);border:3px solid #1a0505;border-radius:6px;padding:.35em .9em;margin:0;box-shadow:3px 4px 0 #000;-webkit-text-stroke:1px #4a0b0b;transform:rotate(-1.2deg);cursor:pointer}
#pbottom button:first-child{font-size:clamp(22px,4.6vh,38px);background:linear-gradient(#ffd23f,#ff9a1f);color:#8a0f12;-webkit-text-stroke:1px #fff3c0}
#pbottom button:hover{transform:rotate(1deg) scale(1.05)}
#menu{position:fixed;inset:0;padding:0;background:#400;overflow:hidden}
#poster{position:absolute;inset:0;width:auto;height:auto;aspect-ratio:auto;border:0;box-shadow:none;transform:none}
@media (max-aspect-ratio:3/4){#poster{width:auto;height:auto}}
#pstage{position:absolute;top:0;bottom:0;left:50%;width:min(100%,80vh);transform:translateX(-50%)}
#ptitle{top:1.5%}
#title{display:none}
#menu.ps #ptitle,#menu.ps #pscore,#menu.ps #pbottom{display:none}
#menu.pm #phead,#menu.pm #pcard{display:none}
#menu.ps #pstage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:min(100%,640px);padding:2vh 3vw}
#phead{width:min(100%,520px)}
#phead svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
#pcard{width:100%;background:linear-gradient(#fff4d6,#f0d9a0);border:4px solid #1a0505;box-shadow:6px 8px 0 rgba(0,0,0,.6);padding:14px 18px;color:#2b2118;text-align:center;transform:rotate(-.6deg);max-height:68vh;overflow:auto}
#pcard p{font-size:15px}
#pcard #btns button{font-family:Anton,Impact,sans-serif;font-size:clamp(16px,3vh,24px);letter-spacing:.06em;text-transform:uppercase;color:#ffe36a;background:linear-gradient(#e0282a,#9b0f14);border:3px solid #1a0505;border-radius:6px;padding:.3em .9em;margin:6px 0 0;box-shadow:3px 4px 0 #000;-webkit-text-stroke:1px #4a0b0b;transform:rotate(-1deg);cursor:pointer}
#pcard #btns button:first-child{background:linear-gradient(#ffd23f,#ff9a1f);color:#8a0f12;-webkit-text-stroke:1px #fff3c0}
#pcard #btns button:hover{transform:rotate(1deg) scale(1.05)}
#pcard .keybtn{font-family:Anton,Impact,sans-serif;letter-spacing:.04em;margin:0}
@media (max-aspect-ratio:3/4){#menu.ps #pchars{display:none}}
#hud{align-items:flex-start;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.55))}
.chip{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;line-height:1;min-width:62px;padding:5px 12px 5px 20px;font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#b3121a;background:linear-gradient(#fff4d6,#f0d9a0);border:3px solid #1a0505;border-radius:4px;box-shadow:none;-webkit-mask:radial-gradient(circle 5px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 5px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 5px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 5px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.chip::before{content:'';position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--c,#d8261c);border-right:2px dashed #1a0505}
.chip i{font-style:normal;font-size:10px;letter-spacing:.16em;color:#6b3a1a}
.chip b{font-weight:400;font-size:20px;color:#b3121a}
#score{--c:#d8261c}#wavec{--c:#f2b630}#dashc{--c:#0a7a3f}#lives{--c:#c4166b}#lives b{color:#d8261c;letter-spacing:.04em}
#pausebtn{padding:5px 12px;min-width:0;align-items:center;font-size:18px;color:#8a0f12;--c:#1a0505}
#pausebtn::before{display:none}
@media (max-width:480px){.chip{padding:4px 8px 4px 16px;min-width:0}.chip b{font-size:16px}.chip i{font-size:9px}#hud{gap:4px}}
#combo{top:calc(env(safe-area-inset-top,0px) + 70px);transform:rotate(-2deg)}
#ctext{font-family:Ultra,'Bowlby One',Impact,serif;-webkit-text-stroke:2px #4a0b0b;text-shadow:2px 3px 0 #1a0505}
#cwrap{border:2px solid #1a0505;background:#fff4d6;height:8px;border-radius:2px}
#cbar{background:repeating-linear-gradient(90deg,#d8261c 0 8px,#f2b630 8px 16px)}
#cspd{font-family:Anton,Impact,sans-serif;letter-spacing:.1em;font-size:13px;color:#fff4d6;text-shadow:1px 2px 0 #1a0505}
#banner{top:24%}
.bm svg{display:block;width:min(88vw,460px);height:auto;margin:0 auto;filter:drop-shadow(0 5px 5px rgba(0,0,0,.5))}
.bs{display:inline-block;margin-top:6px;padding:4px 16px;font-family:Anton,Impact,sans-serif;font-size:clamp(14px,2.4vh,19px);letter-spacing:.1em;text-transform:uppercase;color:#ffe36a;background:#c8161d;border:3px solid #1a0505;box-shadow:3px 4px 0 #000;text-shadow:none;transform:rotate(-1.5deg)}
#fx span{font-family:Ultra,'Bowlby One',Impact,serif;color:#ffe36a;-webkit-text-stroke:2px #4a0b0b;text-shadow:2px 3px 0 #1a0505}
#map{border:3px solid #1a0505;box-shadow:0 0 0 4px #f3e6c4,4px 6px 0 4px rgba(0,0,0,.5);transform:rotate(-1deg);left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
#swing,#dash{font-family:Anton,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;border:4px solid #1a0505;box-shadow:3px 4px 0 #000}
#swing{background:radial-gradient(circle at 35% 30%,#ffd23f,#ff9a1f);color:#8a0f12;-webkit-text-stroke:1px #fff3c0}
#dash{background:radial-gradient(circle at 35% 30%,#9fe0ff,#2a7de1);color:#fff;font-size:15px;-webkit-text-stroke:1px #123a78}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,45,25,.72);padding:20px}
#card{background:var(--paper);border:4px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:24px 28px;max-width:420px;text-align:center}
h1{font-family:'Bowlby One',Impact,sans-serif;font-weight:400;font-size:40px;line-height:1;margin:0 0 12px;color:var(--red)}
p{margin:6px 0;font-size:16px;line-height:1.4}
button{font:inherit;font-weight:800;font-size:18px;background:var(--tape);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:10px 22px;margin-top:14px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
#map{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:220px;height:110px;border:3px solid var(--ink);border-radius:8px;pointer-events:none}
#dash{position:fixed;right:122px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:76px;height:76px;border-radius:50%;font-size:15px;display:none;padding:0;background:#7fd4ff}
#swing{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:92px;height:92px;border-radius:50%;font-size:16px;display:none;padding:0}
@media (pointer:coarse){#swing,#dash{display:block}}
</style>
</head>
<body>
<div id="hud"><div class="chip" id="score"><i>SCORE</i><b>0</b></div><div class="chip" id="wavec"><i>WAVE</i><b>0</b></div><div class="chip" id="dashc"><i>BEAT</i><b>⚡</b></div><div class="chip" id="lives"><i>LIVES</i><b>♥♥♥♥♥</b></div><button class="chip" id="pausebtn" aria-label="Pause">⏸</button></div>

<linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe0"/><stop offset=".38" stop-color="#ffe36a"/><stop offset=".62" stop-color="#ff9a1f"/><stop offset="1" stop-color="#d6331b"/></linearGradient>

<animate attributeName="x1" values="-.5;-.5;1.1;1.1" keyTimes="0;.7;.86;1" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="-.1;-.1;1.5;1.5" keyTimes="0;.7;.86;1" dur="9s" repeatCount="indefinite"/></linearGradient>

<text x="300" y="218" font-size="124" textLength="470" lengthAdjust="spacingAndGlyphs" fill="url(#sh)">WATCH</text></g>
<g transform="rotate(-1.5 300 250)"><polygon points="50,236 552,232 542,268 60,272" fill="#c8161d" stroke="#1a0505" stroke-width="4"/><text x="300" y="262" font-family="Anton,Impact,sans-serif" font-size="28" textLength="420" lengthAdjust="spacingAndGlyphs" text-anchor="middle" fill="#ffe36a" stroke="#1a0505" stroke-width="3" paint-order="stroke">THE CANE OF JUSTICE</text></g></g></svg>

<script>
(function(){
const R=Math.random;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf0d9b5);scene.fog=new THREE.Fog(0xf0d9b5,30,62);
const cam=new THREE.PerspectiveCamera(50,1,.1,150);
const camOff=new THREE.Vector3();let rt=null,postMat=null;
function resize(){const w=innerWidth,h=innerHeight,p=w/h<.8;renderer.setSize(w,h);cam.aspect=w/h;camOff.set(0,p?13:8,p?13:10);cam.updateProjectionMatrix();if(rt){const pr=renderer.getPixelRatio();rt.setSize(w*pr,h*pr);postMat.uniforms.res.value.set(w*pr,h*pr);}}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xffffff,0x4a6a3a,.85));
const sun=new THREE.DirectionalLight(0xfff0c0,.8);sun.position.set(6,12,8);scene.add(sun);
const M=c=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,c,x,y,z,par){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);(par||scene).add(m);return m;}
function flat(w,d,c,z,y){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M(c));m.rotation.x=-Math.PI/2;m.position.set(0,y||0,z);scene.add(m);}
// world: near shoulder z>11.4, carriageway A 5.4..11.4 (cars go +x), median 3.2..5.4, carriageway B -2.8..3.2 (cars go -x), far side z<-2.8
const NEAR=11.4,MED_A=5.4,MED_B=3.2,FAR=-2.8;
// ---- environment shaders: detailed market ground, pavers and worn asphalt ----
const GL_COMMON=`
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

      else{const n=t===2?1:2,a0=.15,a1=.85;if(k<a0)off=-.8+2.1*e(k/a0);else if(k<a1)off=1.3-n*T2*e((k-a0)/(a1-a0));else off=1.3-n*T2-2.1*e((k-a1)/(1-a1));}}
     caneP.rotation.z=ca+off;caneP.position.set(faceDir.x*.6,1,faceDir.z<-.3?-.12:.08);
     if(k>=.15&&k<.9&&swTier>=1){const L=2.7*caneP.scale.x,ph=caneP.rotation.z,tx=player.position.x+faceDir.x*.6+L*Math.cos(ph),ty=1+L*Math.sin(ph)*Math.cos(TILT),tz=player.position.z-L*Math.sin(ph)*Math.sin(TILT);
      if(swTier===1)emit(PT.star,tx,ty,tz,1,1,.45,.3,0,6);else if(swTier===2){emit(PT.puff,tx,ty,tz,1,1,.7,.3,0,4);emit(PT.star,tx,ty,tz,1,1,.5,.3,0,6);}else emit(PT.fire,tx,ty,tz,2,1.5,1.1,.35,0,0);}}
    {const ct=combo>=2?tierOf(combo):0;caneP.scale.setScalar(1+ct*.3);caneP.material.color.setHex([0xffffff,0xfff0a0,0xffb060,0xff6a6a][ct]);pop=Math.max(0,pop-dt);pbb.scale.setScalar(1+pop*(1+ct)*.6);}
    waveUpdate(dt);
    carT-=dt;if(carT<=0){spawnCar();carT=1.2+R()*2.2;}
    // cars
    for(let i=cars.length-1;i>=0;i--){const c=cars[i],u=c.userData,d=u.l.d;let stop=false,ped=false;
      walkers.forEach(w=>{const ahead=(w.position.x-c.position.x)*d;if(Math.abs(w.position.z-u.l.z)<1.7&&ahead>-1&&ahead<7){stop=true;ped=true;}});
      cars.forEach(o=>{if(o!==c&&o.userData.l===u.l){const g=(o.position.x-c.position.x)*d;if(g>0&&g<4.8)stop=true;}});
      const target=stop?0:u.cruise;u.v+=Math.sign(target-u.v)*Math.min(Math.abs(target-u.v),(stop?22:8)*dt);
      c.position.x+=u.v*d*dt;u.tail.color.setHex(stop?0xff2a2a:0x7a1010);u.wheels.forEach(w=>w.rotation.z-=u.v*dt/.36);u.honk-=dt;
      if(ped&&u.v<3&&u.honk<=0){u.honk=2.5;fx('HONK!',c.position.clone().setY(2));}
      if(Math.abs(c.position.x)>50){scene.remove(c);cars.splice(i,1);}}
    for(let i=drops.length-1;i>=0;i--){const d=drops[i],u=d.userData;u.t+=dt;u.life-=dt;
      u.bb.position.y=u.t<.5?Math.sin(u.t/.5*Math.PI)*1.2:.2+Math.sin(u.t*4)*.08;if(u.t<.5)d.position.x+=u.vx*dt;
      d.visible=u.life>2||Math.floor(u.life*8)%2===0;
      if(u.t>.3&&(u.kind!=='hp'||lives<5)&&Math.hypot(d.position.x-player.position.x,d.position.z-player.position.z)<1.6){if(u.kind==='hp'){lives=Math.min(5,lives+1);hearts();fx('+1 LIFE!',d.position.clone().setY(2),24);emit(PT.star,d.position.x,1,d.position.z,8,5,.7,.7,4,10);}else{dashes=Math.min(5,dashes+1);dashHud();fx('+DASH!',d.position.clone().setY(2));}scene.remove(d);drops.splice(i,1);continue;}
      if(u.life<=0){scene.remove(d);drops.splice(i,1);}}
    // walkers
    for(let i=walkers.length-1;i>=0;i--){const w=walkers[i],u=w.userData;u.t+=dt;
      if(u.state==='walk'){const dir=new THREE.Vector3(u.tx-w.position.x,0,(u.dir<0?-6:18)-w.position.z).normalize();
        let sm=1;if(u.pat==='zig'){dir.x+=Math.sin(u.t*3+u.ph)*1.1;dir.normalize();}else if(u.pat==='stopgo')sm=Math.sin(u.t*2+u.ph)>-.25?1.5:0;else if(u.pat==='sprint')sm=1.7;
        const onMed=w.position.z<MED_A&&w.position.z>MED_B;
        w.position.x+=dir.x*u.speed*sm*dt;w.position.z+=dir.z*u.speed*sm*dt*(onMed?.6:1);
        setSprite(u.bb,'w',u.t*(sm||1),dir.x,dir.z,sm>0);
        w.position.y=onMed?Math.sin((MED_A-w.position.z)/(MED_A-MED_B)*Math.PI)*1.5:(sm>0?Math.abs(Math.sin(u.t*8))*.1:0);
        if(u.dir<0?w.position.z<FAR-.3:w.position.z>NEAR+.3){fx('Made it!',w.position.clone().setY(2.5));breakCombo();lives--;hearts();scene.remove(w);walkers.splice(i,1);if(lives<=0)end();}
      }else{w.position.z-=u.dir*u.v*dt;w.position.x+=Math.sin(u.t*20)*dt*2;fleeFx(w,u,dt);
        if(u.dead||(u.dir<0?w.position.z>19:w.position.z<-12)){scene.remove(w);walkers.splice(i,1);}}}
  }
  updateBg(dt,performance.now()/1000);SHM.forEach(m=>m.uniforms.uT.value=performance.now()/1000%1000);if(menuOn)posterTick(performance.now()/1000);updateAim(performance.now()/1000);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy-=p.grav*dt;p.sp.position.x+=p.vx*dt;p.sp.position.y+=p.vy*dt;p.sp.position.z+=p.vz*dt;if(p.sp.position.y<.1&&p.grav>0){p.sp.position.y=.1;p.vy*=-.35;p.vx*=.7;}p.m.rotation+=p.spin*dt;p.m.opacity=Math.min(1,p.life/(p.max*.4));if(p.life<=0){scene.remove(p.sp);p.m.dispose();parts.splice(i,1);}}
  const kc=1-Math.exp(-6*dt);cam.position.lerp(player.position.clone().add(camOff).addScaledVector(vel,.25),kc);look.lerp(player.position,kc);if(shake>0){cam.position.x+=(R()-.5)*shake;cam.position.y+=(R()-.5)*shake;shake=Math.max(0,shake-dt*2.5);}cam.lookAt(look.x,0,look.z-2);drawMap();
  postMat.uniforms.t.value=performance.now()/1000%100;renderer.setRenderTarget(rt);renderer.render(scene,cam);renderer.setRenderTarget(null);renderer.render(postScene,postCam);}
loop();screen('menu');
})();
